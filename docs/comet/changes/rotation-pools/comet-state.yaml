  - id: A1
    source: brief.md
    text: A1：控制台设置中出现「轮转池」标签页，可创建、编辑、删除多个轮转池；每个池可配置名称、Cloudflare API Token、Zone
      ID（可留空自动解析）、域名、Proxied，并关联多个已配置实例。
    result: pending
    reason: null
  - id: A2
    source: brief.md
    text: A2：轮转池配置随 `/api/v1/config` 一起保存与读取；Cloudflare Token
      在数据库中加密存储，读取回显时脱敏（留空保持不变）。
    result: pending
    reason: null
  - id: A3
    source: brief.md
    text: A3：实例已开启「每日定时开关机」时，将其加入轮转池被拒绝并提示；实例已在轮转池中时，开启「每日定时开关机」被拒绝并提示；两个方向均在保存配置时校验。
    result: pending
    reason: null
  - id: A4
    source: brief.md
    text: A4：轮转池启用且池内 ≥2 个实例时，每天到全局轮转时刻：先开机下一台实例；开机成功后轮询获取该实例公网 IPv4（每 10 秒一次、最多 12
      次，PublicIpAddress 优先、EIP 兜底）；拿到 IP 后把池域名的 A 记录更新/创建为该 IPv4；DDNS
      更新成功后关机其余池内实例。开机失败、IP 超时或 DDNS
      失败均视为切换失败：不关机旧实例、记录错误日志并通过现有通知渠道告警。轮转位置按天推进并在进程重启后保持连续（持久化轮转状态）。
    result: pending
    reason: null

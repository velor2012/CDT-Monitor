      精确匹配池成员）并给出差异化中文错误。aliyun Provider 新增
      GetInstancePublicIP（DescribeInstances，PublicIpAddress 优先 EIP 兜底）。notify 新增
      CloudflareClient（v4 API，Bearer Token，Zone 自动解析，A 记录 upsert
      ttl=1/proxied/comment，公网 IPv4 校验，错误格式化）。engine 新增
      rotation.go：checkRotationPools 挂在现有 RunOnce（15s scheduler
      循环）内，dueWithin(10min 窗口) 检测全局 rotation_time，按池 enqueue rotate_pool
      Job（uniqueKey 按池+日期去重）；runRotation 顺序：跳过 schedule_enabled 实例→开机下一台→每 10s
      轮询公网 IP 最多 12 次→SyncARecord 绑定池域名→关机其余 Running/Starting 实例→更新
      current_account_id/last_rotate_date；任一步失败不关旧实例、写 error
      日志、NotificationEvent+Outbox 告警；nextRotationTarget
      按日期差推进保证重启连续。httpapi：saveConfig 校验 rotation_time HH:MM，scrubConfig 清空
      CFToken，applyConfigDefaults 默认 00:00。前端：types.ts
      RotationPool/emptyRotationPool/Config.rotation_time+rotation_pools；App.tsx
      SettingsPanel 新增 rotation 标签页（Globe2 图标）、RotationSettings
      组件（池编辑器：名称/Token/ZoneID/域名/代理/启用、实例多选只列未开定时实例、紧密网格备注+绿红灰圆点）、GeneralSettings
      新增全局轮转时刻 TimePicker；styles.css 新增

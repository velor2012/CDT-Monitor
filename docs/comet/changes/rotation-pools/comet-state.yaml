  summary:
    text: 轮转池功能第二轮候选（含两轮人工测试反馈的全部需求变更），分支 comet/rotation-pools，提交 40e2338（squash 自 7
      个迭代提交）。在第一轮基础上新增：1) 保活互斥——processAccount 的 keepalive
      分支跳过池内实例（AccountInRotationPool），轮转关机不再被抢占式保活拉起；2) 立即轮转——POST
      /api/v1/rotation-pools/{id}/rotate 入队 rotate_pool Job（uniqueKey 带时间戳），复用
      runRotation 全流程与失败保护，前端按钮显示触发结果；3) DDNS 测试——POST
      /api/v1/rotation-pools/{id}/test-ddns 以请求体（当前编辑器未保存状态）为准验证
      Token/Zone/根域名/A 记录，全程只读 GET，Token 留空回退已存值；4) DDNS 配置拆分——根域名+域名前缀分开填写（对齐
      ecs-controller），Zone 按根域名解析，迁移自动回填旧 domain 字段；5)
      池内实例多选下拉——与地域下拉同款样式（搜索/勾选/键盘导航），网格高亮当前活跃实例（config 响应附带
      rotation_pool_states，PUT 侧作为只读透传字段解码）；6) 每池「启用 DDNS」开关——关闭时轮转跳过
      Token/IP/DDNS 全部步骤，只开关机；7) .dockerignore
      补齐新目录（测试数据/master.key/二进制/worktree 不进构建上下文）。验证：go build/vet 通过；go test
      五包全通过（store 预存 flaky TestTraffic24HoursAgoAndAroundTime 与本改动无关，基线同样失败）；npm
      run build 通过；人工测试服务器（8080 端口）实测：配置保存/回显、Token enc:v1
      加密落库且不泄露、双向互斥差异化报错、迁移回填正确。已知限制：真实阿里云 ECS 与 Cloudflare API
      端到端调用未在本地验证（无真实凭据），A4 的完整轮转链路依赖用户在真实环境确认；Verifier subagent 三次派发均因平台 API
      错误（reasoning_effort 参数被拒）失败，独立验收未完成，用户已人工测试并明确接受当前结果。
    truncated: false
